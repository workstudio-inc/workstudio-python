# ==============================================================================
# Publish `workstudio` to PyPI
# ==============================================================================
# Triggered by pushing a tag, so a release is a reviewable git object:
#
#   # bump version in pyproject.toml, commit
#   git tag v0.1.0 && git push --follow-tags
#
# Authentication: PyPI Trusted Publishing (OIDC) is preferred — no long-lived
# token to leak or rotate. Configure it once at
# https://pypi.org/manage/project/workstudio/settings/publishing/ with:
#     owner: workstudio-inc   repo: workstudio-python
#     workflow: publish.yml   environment: pypi
#
# Until the project exists on PyPI, trusted publishing is set up as a "pending
# publisher" on the same page. Failing that, set a PYPI_API_TOKEN secret and
# swap the final step for one passing `password: ${{ secrets.PYPI_API_TOKEN }}`.
#
# PyPI does not allow reusing a version number, ever — not even after deletion.
# The check below catches the common mistake before the upload rather than after.
# ==============================================================================

name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # A tag that disagrees with pyproject.toml publishes a surprise version.
      - name: Tag must match pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag $TAG != pyproject $PKG"; exit 1; }

      - name: Build
        run: python -m build

      - name: Check the artefacts
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing requires this environment name to match the PyPI config.
    environment: pypi
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — trusted publishing exchanges the OIDC token instead.
        # If you use an API token instead, add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
